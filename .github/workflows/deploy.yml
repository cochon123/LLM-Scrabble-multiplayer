name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 187.124.144.206
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/.openclaw/workspace/LLM-Scrabble-multiplayer
            git pull origin main
            npm ci
            npm run build
            pm2 restart scrabble-codex
